name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary platform; Ubuntu keeps the project portable.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm credentials:check
      # Model files (MediaPipe, Moonshine speech) are pinned by SHA-256 in the lock file: download them once per lock.
      - uses: actions/cache@v6
        with:
          path: apps/web/public/models
          key: models-${{ hashFiles('scripts/assets.lock.json') }}
      - run: pnpm assets

      - name: Read Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Recorded test clips are stored as MP4 and converted to .y4m for Chromium's fake camera.
      - name: Ensure ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else choco install ffmpeg -y --no-progress; fi
          fi
          ffmpeg -version | head -1

      - name: Install Chromium
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The Rhino plugin is C# and does not need Rhino to be built or tested: its core (messages, change coalescer, mesh asset
  # writer, Python requirement and result handling) runs in plain .NET, and the plugin itself is compiled for both of
  # the runtimes Rhino 8 uses against the public RhinoCommon package. The TypeScript side reads the same fixtures in
  # `pnpm test` (scripts/rhino-plugin-contract.test.mjs).
  rhino-plugin:
    name: rhino plugin (dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - run: dotnet test plugins/rhino/tests/HAI.Rhino.Core.Tests --configuration Release
      - run: dotnet build plugins/rhino/src/HAI.Rhino/HAI.Rhino.csproj --configuration Release
