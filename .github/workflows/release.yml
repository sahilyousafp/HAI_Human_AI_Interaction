name: Release

# A version tag (v1.2.3) builds, signs and verifies the Windows installer and publishes it as a GitHub release: the installer,
# its block map, the update feed (latest.yml, which the app's updater reads) and the SHA-256 the download page shows.
# Nothing is published unless the signature is valid: apps/desktop/scripts/release-assets.ts fails the job first.
#
# Run by hand (Actions > Release > Run workflow) it is a dry run: an unsigned build whose files are kept as a workflow
# artifact, never a release, to see that the pipeline works before there is anything to sign with.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (no leading v)
        default: 0.0.0-dryrun
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CI: "true"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      # Azure Trusted Signing (the preferred route) ...
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      HAI_AZURE_ENDPOINT: ${{ vars.HAI_AZURE_ENDPOINT }}
      HAI_AZURE_PROFILE: ${{ vars.HAI_AZURE_PROFILE }}
      HAI_AZURE_ACCOUNT: ${{ vars.HAI_AZURE_ACCOUNT }}
      # ... or a code-signing certificate (CSC_LINK is the .pfx as base64 or a path), whichever is set up.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      HAI_PUBLISHER_NAME: ${{ vars.HAI_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version (1.2.3 or 1.2.3-beta.1)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Quick checks before anything is built: what ships must still pass the project's own rules.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm credentials:check

      # Azure Trusted Signing's PowerShell module, only when that route is the one configured.
      - name: Trusted Signing module
        if: env.HAI_AZURE_ACCOUNT != ''
        shell: pwsh
        run: Install-Module -Name TrustedSigning -Force -Scope CurrentUser -Repository PSGallery

      - name: Build the installer
        shell: bash
        env:
          HAI_VERSION: ${{ steps.version.outputs.version }}
          HAI_ALLOW_UNSIGNED: ${{ env.DRY_RUN == 'true' && '1' || '0' }}
        run: pnpm --filter @hai/desktop run dist

      - name: Check what was built (a valid signature, a feed that matches, the checksum)
        id: files
        shell: bash
        working-directory: apps/desktop
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--allow-unsigned"; fi
          node scripts/release-assets.ts --version "${{ steps.version.outputs.version }}" $flags | tee ../../upload.txt
          {
            echo "files<<EOF"
            sed 's#\\#/#g' ../../upload.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The download page, made from this release's own size and SHA-256 so it cannot disagree with the file. Deploying it to
      # Catalyst Slate needs the project's Catalyst account, so it is kept as an artifact (see docs/desktop.md).
      - name: Make the download page
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ] || [ -z "$HAI_PUBLISHER_NAME" ]; then flags="--unsigned"; fi
          node scripts/make-download-page.ts --version "$VERSION" --out ../../site --repo "$GITHUB_REPOSITORY" $flags

      - name: Keep the download page
        uses: actions/upload-artifact@v7
        with:
          name: download-page-${{ steps.version.outputs.version }}
          path: site/index.html

      - name: "Dry run: keep the files as an artifact"
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: HAI-dry-run-${{ steps.version.outputs.version }}
          path: ${{ steps.files.outputs.files }}

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(cut -d' ' -f1 apps/desktop/release/HAI-Setup-"$VERSION".exe.sha256)
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          Download **HAI-Setup-$VERSION.exe** and double click it. It installs for your user only and needs no administrator rights.

          SHA-256: \`$sha\`
          EOF
          mapfile -t files < <(cat upload.txt | sed 's#\\#/#g')
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag --title "HAI $VERSION" --notes-file notes.md $prerelease
